name: Build HDFC Bank Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (HDFC Bank)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Dist Bundle
        run: npm run build

      - name: Initialize Android Platform and App Icon
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/set-app-icon.js
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload HDFC Bank APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDFC_Bank_App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
